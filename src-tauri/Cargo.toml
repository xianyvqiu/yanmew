[package]
name = "yanwenzi"
version = "0.1.0"
description = "颜文字桌宠"
edition = "2021"

[lib]
name = "yanwenzi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "gzip"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "=2.5.1"
windows = { version = "0.61", features = ["Devices_Geolocation", "Foundation", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
