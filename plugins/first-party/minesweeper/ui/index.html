<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫雷 · 颜喵</title><link rel="stylesheet" href="classic.css"></head>
<body><main><header><div><p class="caption">颜喵经典游戏</p><h1>扫雷</h1></div><button id="help" type="button">游玩帮助</button><div class="stat"><span class="caption">全局余额</span><strong id="balance">—</strong></div></header>
<section class="card"><div class="bar"><h2>选择难度</h2><select id="level" aria-label="扫雷难度"><option value="easy">初级 · 8×8 · 10雷 · 5喵币</option><option value="medium">中级 · 16×16 · 40雷 · 20喵币</option><option value="hard">高级 · 16×30 · 99雷 · 50喵币</option></select></div><p class="help">赚钱模式通关奖励为入场费的2倍（初级10、中级40、高级100喵币）。每日最多5局，和2048分别计算。首击安全。</p></section>
<section class="modes" aria-label="游玩方式"><button class="mode" id="play" disabled><strong>免费游玩</strong><span>不限次数，不扣喵币，也不领奖</span></button><button class="mode primary" id="earn" disabled><strong id="earn-label">开始赚钱局 · 5喵币</strong><span id="quota">正在读取…</span></button></section>
<p id="notice" role="status" aria-live="polite">正在读取游戏进度…</p>
<section id="game" class="card game-area" hidden><div class="bar"><div class="stats"><div class="stat"><span class="caption">剩余地雷</span><strong id="remaining">10</strong></div><div class="stat"><span class="caption">本局用时</span><strong id="elapsed">00:00</strong></div><div class="stat"><span class="caption">当前模式</span><strong id="mode" style="font-size:16px">游玩</strong></div></div><button id="end">放弃本局</button></div><div class="board-wrap"><div id="board" class="mine-board" role="group" aria-label="扫雷棋盘"></div></div><p class="help">左键翻开；右键依次标旗、问号、取消。双击已翻开的数字格：相邻旗数一致时展开其余格，标错旗可能踩雷。键盘可用Tab和Enter翻格、Shift+F10标旗。</p></section>
</main><script src="runtime.js"></script><script src="classic-runtime.js"></script><script src="engine.js"></script><script src="game.js"></script></body></html>
