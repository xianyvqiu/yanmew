<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剪刀石头布 · 纸贴纸街机</title>
<style>
/* ============================================================
   插件独立主题变量（不读宿主）
   ============================================================ */
:root {
  --rps-paper: #FFFDF7;
  --rps-ink: #1F1B16;
  --rps-ink-dim: #8A8175;
  --rps-line: rgba(31, 27, 22, .055);
  --rps-border: rgba(31, 27, 22, .12);
  --rps-border-strong: rgba(31, 27, 22, .22);

  --rps-rock: #E5484D;
  --rps-rock-shadow: #A72F33;
  --rps-scissors: #3B82F6;
  --rps-scissors-shadow: #2557A8;
  --rps-paper-hand: #F5B700;
  --rps-paper-hand-shadow: #AE8200;

  --rps-win: #4CAF7D;
  --rps-lose: #E5484D;
  --rps-draw: #8A8175;

  --rps-ease-spring: cubic-bezier(.34, 1.56, .64, 1);
  --rps-ease-out: cubic-bezier(.22, 1, .36, 1);
  --rps-ease-soft: cubic-bezier(.4, 0, .2, 1);
  --rps-font-mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
}

/* ============================================================
   基础
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--rps-ink);
  background:
    radial-gradient(ellipse at 20% 15%, #38404d 0%, transparent 50%),
    radial-gradient(ellipse at 85% 85%, #2c3b48 0%, transparent 55%),
    #14171d;
  display: grid;
  place-items: center;
  padding: 30px 20px;
  min-height: 100vh;
  overflow: auto;
}

/* ============================================================
   插件窗口：初始尺寸由插件决定，可缩放
   ============================================================ */
.plugin-window {
  position: relative;
  width: 340px;
  height: 520px;
  min-width: 300px;
  min-height: 480px;
  max-width: 620px;
  max-height: 740px;
  resize: both;
  overflow: hidden;
  border-radius: 20px;
  background-color: var(--rps-paper);
  background-image:
    linear-gradient(var(--rps-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--rps-line) 1px, transparent 1px);
  background-size: 20px 20px;
  box-shadow:
    0 30px 70px -20px rgba(0, 0, 0, .65),
    0 8px 24px -8px rgba(0, 0, 0, .35),
    inset 0 0 0 1px rgba(255, 255, 255, .5);
  container-type: inline-size;
  container-name: rps;
}

.game {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px;
  height: 100%;
  overflow: hidden;
}

/* ============================================================
   顶部栏
   ============================================================ */
.head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: none;
}

.sticker {
  background: #FFFFFF;
  border: 1px solid var(--rps-border);
  border-radius: 12px;
  box-shadow: 0 3px 10px -4px rgba(31, 27, 22, .14);
  padding: 6px 11px;
  display: flex;
  align-items: baseline;
  gap: 5px;
  font-size: 12px;
  line-height: 1;
  flex: none;
}

.wallet .balance {
  font-family: var(--rps-font-mono);
  font-size: 15px;
  font-weight: 700;
  color: var(--rps-ink);
  transition: color .35s var(--rps-ease-out);
  display: inline-block;
}
.wallet .balance.up { color: var(--rps-win); }
.wallet .balance.down { color: var(--rps-lose); }
.wallet .label { font-size: 10px; color: var(--rps-ink-dim); }

.quota .used {
  font-family: var(--rps-font-mono);
  font-size: 13px;
  font-weight: 700;
}
.quota .total {
  font-family: var(--rps-font-mono);
  font-size: 11px;
  color: var(--rps-ink-dim);
}

.head-spacer { flex: 1; }

.perm-btn {
  font-family: inherit;
  font-size: 10.5px;
  padding: 6px 10px;
  border-radius: 12px;
  border: 1px solid var(--rps-border);
  background: #FFFFFF;
  color: var(--rps-ink-dim);
  cursor: pointer;
  box-shadow: 0 3px 10px -4px rgba(31, 27, 22, .14);
  transition: all .3s var(--rps-ease-out);
  white-space: nowrap;
  flex: none;
}
.perm-btn:hover {
  color: var(--rps-ink);
  border-color: var(--rps-border-strong);
  transform: translateY(-1.5px);
}
.perm-btn.off {
  color: var(--rps-lose);
  border-color: color-mix(in srgb, var(--rps-lose) 40%, transparent);
}

.playmode {
  display: none;
  font-size: 10.5px;
  color: var(--rps-ink-dim);
  text-align: center;
  padding: 5px 10px;
  border: 1px dashed var(--rps-border-strong);
  border-radius: 10px;
  background: rgba(255, 255, 255, .55);
  flex: none;
}
.playmode.show { display: block; }

/* ============================================================
   对战场
   ============================================================ */
.stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px 12px;
  background: rgba(255, 255, 255, .55);
  border: 1px solid var(--rps-border);
  border-radius: 18px;
  box-shadow: 0 3px 10px -4px rgba(31, 27, 22, .12);
  flex: none;
}

.hand {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.hand-figure {
  width: 84px;
  height: 84px;
  border-radius: 16px;
  background: #FFFFFF;
  border: 2px solid var(--rps-border);
  display: grid;
  place-items: center;
  font-size: 38px;
  line-height: 1;
  box-shadow: 0 3px 10px -4px rgba(31, 27, 22, .14);
  transition: border-color .3s var(--rps-ease-out);
  will-change: transform;
  flex: none;
}

.hand-figure.pop { animation: handPop .55s var(--rps-ease-spring); }
@keyframes handPop {
  0%   { transform: scale(.55) rotate(-8deg); opacity: .35; }
  60%  { transform: scale(1.12) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

.hand-figure.shake { animation: handShake .44s var(--rps-ease-soft); }
@keyframes handShake {
  0%, 100% { transform: rotate(0); }
  25%      { transform: rotate(-8deg); }
  75%      { transform: rotate(8deg); }
}

.hand-figure.waiting {
  animation: waitBlink .56s var(--rps-ease-soft) infinite alternate;
}
@keyframes waitBlink {
  from { opacity: .4; transform: scale(.97); }
  to   { opacity: 1;  transform: scale(1.02); }
}

.hand-label {
  font-size: 10px;
  letter-spacing: .6px;
  color: var(--rps-ink-dim);
  text-transform: uppercase;
}

.vs {
  flex: none;
  font-family: var(--rps-font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--rps-ink-dim);
  letter-spacing: 1px;
}

.countdown {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--rps-ink);
  opacity: 0;
  text-shadow:
    0 2px 0 rgba(255, 255, 255, .95),
    0 0 8px rgba(255, 255, 255, .85);
}
.countdown.pop { animation: countPop .28s var(--rps-ease-out); }
@keyframes countPop {
  0%   { opacity: 0; transform: scale(1.35); }
  35%  { opacity: 1; transform: scale(1); }
  100% { opacity: 1; transform: scale(1); }
}

/* ============================================================
   结果印章
   ============================================================ */
.result-area {
  min-height: 44px;
  display: grid;
  place-items: center;
  flex: none;
}

.stamp {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 18px;
  border: 2px solid currentColor;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: .8px;
  position: relative;
  transform: rotate(-4deg);
  background: rgba(255, 255, 255, .55);
  opacity: 0;
}
.stamp::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid currentColor;
  border-radius: 7px;
  opacity: .35;
}
.stamp.show { animation: stampIn .5s var(--rps-ease-spring) forwards; }
@keyframes stampIn {
  0%   { opacity: 0; transform: scale(1.6) rotate(-16deg); }
  60%  { opacity: 1; transform: scale(.94) rotate(-2deg); }
  100% { opacity: 1; transform: scale(1) rotate(-4deg); }
}
.stamp.win  { color: var(--rps-win); }
.stamp.lose { color: var(--rps-lose); }
.stamp.draw { color: var(--rps-draw); }
.stamp .delta {
  font-family: var(--rps-font-mono);
  font-size: 12px;
  opacity: .85;
}

/* ============================================================
   出拳按钮
   ============================================================ */
.actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  flex: 1;
  min-height: 0;
  align-items: center;
}

.hand-btn {
  position: relative;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-family: inherit;
  color: #FFFFFF;
  background: var(--btn-color);
  box-shadow: 0 5px 0 var(--btn-shadow), 0 3px 10px -4px rgba(31, 27, 22, .25);
  transform: translateY(0);
  transition: transform .2s var(--rps-ease-out),
              box-shadow .2s var(--rps-ease-out),
              filter .2s var(--rps-ease-out);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: 100px;
  justify-self: center;
}

.hand-btn .emoji {
  font-size: 26px;
  line-height: 1;
  filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .15));
}
.hand-btn .name {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: .6px;
}

.hand-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 var(--btn-shadow), 0 5px 14px -4px rgba(31, 27, 22, .3);
}
.hand-btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 2px 0 var(--btn-shadow), 0 2px 6px -2px rgba(31, 27, 22, .2);
}
.hand-btn:focus-visible {
  outline: 2px solid var(--rps-ink);
  outline-offset: 3px;
}
.hand-btn:disabled {
  cursor: not-allowed;
  opacity: .35;
  box-shadow: 0 1px 0 var(--btn-shadow);
  transform: translateY(3px);
  filter: saturate(.5);
}

.hand-btn.rock     { --btn-color: var(--rps-rock); --btn-shadow: var(--rps-rock-shadow); }
.hand-btn.scissors { --btn-color: var(--rps-scissors); --btn-shadow: var(--rps-scissors-shadow); }
.hand-btn.paper    { --btn-color: var(--rps-paper-hand); --btn-shadow: var(--rps-paper-hand-shadow); }

/* ============================================================
   底部
   ============================================================ */
.foot {
  text-align: center;
  font-size: 10.5px;
  color: var(--rps-ink-dim);
  letter-spacing: .3px;
  line-height: 1.6;
  flex: none;
}
.foot .rule {
  font-family: var(--rps-font-mono);
  font-size: 10px;
}

/* ============================================================
   金币精灵
   ============================================================ */
.coin-sprite {
  position: fixed;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFE9A8 0%, #F5B700 55%, #C98A00 100%);
  box-shadow:
    inset 0 -2px 3px rgba(140, 90, 0, .3),
    inset 0 1px 2px rgba(255, 255, 255, .7),
    0 0 8px rgba(245, 183, 0, .55);
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
}
.coin-sprite::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  border: 1.5px solid rgba(160, 100, 0, .3);
}
.coin-sprite.lose {
  background: radial-gradient(circle at 35% 30%, #FFC5C5 0%, #E5484D 55%, #8A2023 100%);
  box-shadow:
    inset 0 -2px 3px rgba(80, 0, 0, .35),
    inset 0 1px 2px rgba(255, 255, 255, .6),
    0 0 8px rgba(229, 72, 77, .5);
}
.coin-sprite.lose::after {
  border-color: rgba(140, 30, 30, .35);
}

/* 飘字 */
.float-text {
  position: fixed;
  font-family: var(--rps-font-mono);
  font-size: 15px;
  font-weight: 700;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .85);
}
.float-text.gain { color: var(--rps-win); }
.float-text.lose { color: var(--rps-lose); }

/* ============================================================
   容器查询：随窗口尺寸自适应
   ============================================================ */
@container rps (min-width: 400px) {
  .game { padding: 18px; gap: 14px; }
  .hand-figure { width: 100px; height: 100px; font-size: 46px; border-radius: 18px; }
  .hand-btn { max-width: 120px; }
  .hand-btn .emoji { font-size: 32px; }
  .hand-btn .name { font-size: 11.5px; }
  .vs { font-size: 14px; }
  .stamp { font-size: 16px; padding: 9px 22px; }
  .stamp .delta { font-size: 13px; }
  .wallet .balance { font-size: 17px; }
  .sticker { font-size: 13px; padding: 7px 13px; }
  .countdown { font-size: 28px; }
}

@container rps (min-width: 500px) {
  .hand-figure { width: 118px; height: 118px; font-size: 54px; }
  .hand-btn { max-width: 140px; }
  .hand-btn .emoji { font-size: 38px; }
  .hand-btn .name { font-size: 12.5px; }
}

@container rps (max-width: 320px) {
  .game { padding: 10px; gap: 8px; }
  .hand-figure { width: 66px; height: 66px; font-size: 28px; border-radius: 12px; }
  .hand-btn .emoji { font-size: 22px; }
  .hand-btn .name { font-size: 9.5px; }
  .sticker { font-size: 11px; padding: 5px 9px; }
  .wallet .balance { font-size: 13px; }
  .quota .used { font-size: 12px; }
  .perm-btn { font-size: 9.5px; padding: 5px 8px; }
  .vs { font-size: 10px; }
  .stamp { font-size: 12px; padding: 6px 14px; }
  .stamp .delta { font-size: 11px; }
  .countdown { font-size: 20px; }
  .foot { font-size: 9.5px; }
  .hand-label { font-size: 9px; }
}

/* 减少动态 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .12s !important;
  }
}
</style>
<link rel="stylesheet" href="window.css">
</head>
<body>

<div class="plugin-window" id="pluginWindow">
  <div class="game">

    <!-- 顶部 -->
    <header class="head">
      <div class="sticker wallet">
        <span>🪙</span>
        <span class="balance" id="balance">30</span>
        <span class="label">喵币</span>
      </div>
      <div class="sticker quota">
        <span class="label">今日</span>
        <span class="used" id="quotaUsed">0</span>
        <span class="total" id="quotaTotal">/ 20</span>
      </div>
      <span class="head-spacer"></span>
      <button class="perm-btn" id="permBtn" title="切换喵币权限">喵币：开</button>
    </header>

    <div class="playmode" id="playmode">纯玩模式 · 不下注、不修改喵币</div>

    <!-- 对战场 -->
    <main class="stage">
      <div class="hand user">
        <div class="hand-figure" id="userHand">❔</div>
        <div class="hand-label">你</div>
      </div>
      <div class="vs">VS</div>
      <div class="hand ai">
        <div class="hand-figure" id="aiHand">❔</div>
        <div class="hand-label">AI</div>
      </div>
      <div class="countdown" id="countdown"></div>
    </main>

    <!-- 结果 -->
    <div class="result-area" id="resultArea">
      <span class="stamp" id="stamp">
        <span id="stampText">——</span>
        <span class="delta" id="stampDelta"></span>
      </span>
    </div>

    <!-- 出拳 -->
    <div class="actions">
      <button class="hand-btn scissors" data-choice="scissors" aria-label="出剪刀">
        <span class="emoji">✌️</span>
        <span class="name">剪刀</span>
      </button>
      <button class="hand-btn rock" data-choice="rock" aria-label="出石头">
        <span class="emoji">✊</span>
        <span class="name">石头</span>
      </button>
      <button class="hand-btn paper" data-choice="paper" aria-label="出布">
        <span class="emoji">✋</span>
        <span class="name">布</span>
      </button>
    </div>

    <!-- 底部 -->
    <div class="foot">
      <div class="rule">赢 +5 · 输 −4 · 平 0</div>
      <div id="footHint">点击任意手势开始</div>
    </div>

  </div>
</div>

<script src="runtime.js"></script>
<script src="game.js"></script>

</body>
</html>
