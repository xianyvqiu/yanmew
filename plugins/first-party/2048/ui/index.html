<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · 颜喵</title><link rel="stylesheet" href="classic.css"></head>
<body><main style="max-width:680px"><header><div><p class="caption">颜喵经典游戏</p><h1>2048</h1></div><div class="stat"><span class="caption">全局余额</span><strong id="balance">—</strong></div></header>
<section class="modes" aria-label="游玩方式"><button class="mode" id="play" disabled><strong>免费游玩</strong><span>不限次数，不扣喵币，也不领奖</span></button><button class="mode primary" id="earn" disabled><strong>开始赚钱局 · 20喵币</strong><span id="quota">正在读取…</span></button></section>
<section class="card"><h2>本局奖励</h2><p class="help">按本局最高数字一次结算：256 → 10喵币，512 → 25喵币，1024 → 50喵币，2048及以上 → 200喵币。奖励不逐档累加；未达256不领奖。赚钱模式每局20喵币，每天最多5局，和扫雷分别计算。</p></section>
<p id="notice" role="status" aria-live="polite">正在读取游戏进度…</p>
<section id="game" class="card game-area" hidden><div class="bar"><div class="stats"><div class="stat"><span class="caption">本局得分</span><strong id="score">0</strong></div><div class="stat"><span class="caption">最高数字</span><strong id="highest">2</strong></div><div class="stat"><span class="caption">可领奖励</span><strong id="reward">0</strong></div></div><button id="end" class="primary">结束本局并结算</button></div><div id="board" class="number-board" role="group" aria-label="2048棋盘" tabindex="0"></div><div id="directions" class="directions"><button data-direction="left" aria-label="向左"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m14 6-6 6 6 6"/></svg></button><button data-direction="up" aria-label="向上"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 14 6-6 6 6"/></svg></button><button data-direction="down" aria-label="向下"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 10 6 6 6-6"/></svg></button><button data-direction="right" aria-label="向右"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m10 6 6 6-6 6"/></svg></button></div><p class="help">方向键、下方方向按钮或滑动棋盘均可操作。相邻相同数字相撞合并，每个方块一次移动只合并一次。无法移动时自动结算，也可主动结束当前局。</p></section>
</main><script src="runtime.js"></script><script src="classic-runtime.js"></script><script src="engine.js"></script><script src="game.js"></script></body></html>
